[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helpdesk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "pydantic-settings",
  "python-jose[cryptography]",
  "passlib[bcrypt]",
  "psycopg2-binary",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]